<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Живой источник — Регистрация</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }

        body {
            background: linear-gradient(135deg, #e8eaf0 0%, #d9dce5 50%, #e6e7ee 100%);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; flex-direction: column;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        body::before,
        body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.5;
            z-index: 0;
            pointer-events: none;
        }
        body::before {
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(183, 28, 28, 0.15), transparent 70%);
            top: -100px; left: -100px;
            animation: floatLight 12s ease-in-out infinite;
        }
        body::after {
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(100, 150, 255, 0.15), transparent 70%);
            bottom: -150px; right: -150px;
            animation: floatLight 15s ease-in-out infinite reverse;
        }

        @keyframes floatLight {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(40px, -30px); }
        }

        .site-title {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #b71c1c, #7a0000);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 4px;
            position: relative;
            z-index: 1;
            animation: fadeInDown 0.8s ease-out;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-container {
            width: 440px;
            height: 500px;
            background: linear-gradient(145deg, #eceef5, #d1d4dc);
            border-radius: 50%;
            box-shadow:
                25px 25px 60px #b9bcc4,
                -25px -25px 60px #ffffff,
                inset 0 0 0 1px rgba(255, 255, 255, 0.4);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            padding: 45px 35px;
            position: relative;
            z-index: 1;
            animation: fadeInUp 0.9s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        h2 {
            color: #2c2c2c;
            font-size: 26px;
            margin-bottom: 6px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .subtitle {
            color: #888;
            font-size: 12px;
            margin-bottom: 22px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .input-group {
            width: 100%;
            margin-bottom: 12px;
            position: relative;
        }

        .input-group input,
        .input-group select {
            width: 100%;
            padding: 13px 38px 13px 42px;
            border: none;
            outline: none;
            background: #e6e7ee;
            border-radius: 12px;
            box-shadow:
                inset 4px 4px 8px #c4c5cb,
                inset -4px -4px 8px #ffffff;
            font-size: 13px;
            color: #444;
            font-family: inherit;
            font-weight: 500;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .input-group input:hover,
        .input-group select:hover {
            box-shadow:
                inset 5px 5px 10px #bcbdc4,
                inset -5px -5px 10px #ffffff;
        }

        .input-group input:focus,
        .input-group select:focus {
            box-shadow:
                inset 5px 5px 10px #b8b9c0,
                inset -5px -5px 10px #ffffff,
                0 0 0 2px rgba(183, 28, 28, 0.15);
        }

        .input-group input::placeholder { color: #999; font-weight: 500; }

        .input-group .icon {
            position: absolute;
            left: 14px; top: 50%;
            transform: translateY(-50%);
            font-size: 15px;
            pointer-events: none;
            transition: transform 0.3s ease;
        }

        .input-group:focus-within .icon {
            transform: translateY(-50%) scale(1.15);
        }

        .input-group .arrow {
            position: absolute;
            right: 16px; top: 50%;
            transform: translateY(-50%);
            color: #b71c1c;
            font-size: 10px;
            pointer-events: none;
            transition: transform 0.3s ease;
        }

        .input-group:focus-within .arrow {
            transform: translateY(-50%) rotate(180deg);
        }

        .input-group select.placeholder { color: #999; }
        .input-group select option { color: #333; background: #fff; padding: 10px; }

        .btn-signin {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(145deg, #c62828, #8e0000);
            color: white;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            font-family: inherit;
            box-shadow:
                6px 6px 14px #b9bcc4,
                -6px -6px 14px #ffffff;
            letter-spacing: 1.5px;
            margin-top: 12px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-signin::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.6s ease;
        }

        .btn-signin:hover::before { left: 100%; }

        .btn-signin:hover {
            box-shadow:
                8px 8px 18px #b9bcc4,
                -8px -8px 18px #ffffff,
                0 0 20px rgba(183, 28, 28, 0.3);
            transform: translateY(-2px);
        }

        .btn-signin:active {
            box-shadow:
                inset 5px 5px 10px #7a0000,
                inset -5px -5px 10px #d32f2f;
            transform: translateY(0) scale(0.98);
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(230, 231, 238, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-overlay.active { display: flex; }

        .modal-content {
            background: linear-gradient(145deg, #eceef5, #d1d4dc);
            padding: 45px 40px;
            border-radius: 25px;
            box-shadow:
                15px 15px 40px #b9bcc4,
                -15px -15px 40px #ffffff;
            text-align: center;
            max-width: 380px;
            width: 90%;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { transform: scale(0.7); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .success-icon {
            font-size: 65px;
            margin-bottom: 15px;
            display: block;
            animation: bounceIn 0.6s ease-out 0.3s both;
        }

        @keyframes bounceIn {
            0% { transform: scale(0); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .modal-content h3 {
            color: #2c2c2c;
            margin-bottom: 12px;
            font-size: 23px;
            font-weight: 700;
        }

        .modal-content p {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 25px;
            font-weight: 500;
        }

        .btn-close {
            background: linear-gradient(145deg, #c62828, #8e0000);
            color: white;
            border: none;
            padding: 12px 35px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            font-size: 13px;
            font-family: inherit;
            letter-spacing: 1px;
            box-shadow:
                4px 4px 10px #b9bcc4,
                -4px -4px 10px #ffffff;
            transition: all 0.3s ease;
        }

        .btn-close:hover {
            transform: translateY(-2px);
            box-shadow:
                6px 6px 14px #b9bcc4,
                -6px -6px 14px #ffffff,
                0 0 15px rgba(183, 28, 28, 0.3);
        }

        .btn-close:active {
            box-shadow:
                inset 4px 4px 8px #7a0000,
                inset -4px -4px 8px #d32f2f;
            transform: scale(0.96);
        }

        @media (max-width: 520px) {
            body { padding: 15px; }
            .site-title { font-size: 20px; letter-spacing: 3px; margin-bottom: 18px; }
            .login-container { width: 340px; height: 470px; padding: 35px 25px; }
            h2 { font-size: 21px; }
            .subtitle { font-size: 11px; margin-bottom: 18px; }
            .input-group input,
            .input-group select { font-size: 12px; padding: 11px 32px 11px 38px; }
            .input-group .icon { font-size: 13px; left: 12px; }
            .input-group .arrow { right: 13px; font-size: 9px; }
            .btn-signin { padding: 12px; font-size: 12px; }
            .modal-content { padding: 35px 25px; }
            .success-icon { font-size: 55px; }
            .modal-content h3 { font-size: 20px; }
            .modal-content p { font-size: 13px; }
        }

        @media (max-width: 360px) {
            .login-container { width: 300px; height: 440px; }
            h2 { font-size: 19px; }
            .input-group input,
            .input-group select { font-size: 11px; padding: 10px 30px 10px 35px; }
        }
    </style>
</head>
<body>

    <div class="site-title">Живой источник</div>

    <div class="login-container">
        <h2>Регистрация</h2>
        <p class="subtitle">Присоединяйтесь к нам</p>

        <form id="registrationForm" class="registration-form">

            <div class="input-group">
                <span class="icon">👤</span>
                <input type="text" id="fio" placeholder="Ф.И.О." required>
            </div>

            <div class="input-group">
                <span class="icon">📱</span>
                <input type="text" id="social" placeholder="Соцсеть для связи (VK, TG)" required>
            </div>

            <div class="input-group">
                <span class="icon">📍</span>
                <input type="text" id="city" placeholder="Город" required>
            </div>

            <div class="input-group">
                <span class="icon">⛪</span>
                <input type="text" id="church" placeholder="Название церкви" required>
            </div>

            <div class="input-group">
                <span class="icon">💰</span>
                <select id="donation" required class="placeholder">
                    <option value="" disabled selected>Сделали ли вы пожертвования 500 ₽?</option>
                    <option value="Да, сделал(а)">Да, сделал(а)</option>
                    <option value="Как приеду — сделаю">Как приеду — сделаю</option>
                    <option value="Никак не смогу сделать">Никак не смогу сделать</option>
                </select>
                <span class="arrow">▼</span>
            </div>

            <button type="submit" class="btn-signin">ЗАРЕГИСТРИРОВАТЬСЯ</button>
        </form>
    </div>

    <div class="modal-overlay" id="successModal">
        <div class="modal-content">
            <span class="success-icon">✅</span>
            <h3>Успешная регистрация!</h3>
            <p>Спасибо, что присоединились к «Живому источнику». Ваши данные отправлены. Мы свяжемся с вами в ближайшее время.</p>
            <button class="btn-close" onclick="closeModal()">ОТЛИЧНО</button>
        </div>
    </div>

    <!-- Локальный файл с токеном. На GitHub его не будет (см. .gitignore) -->
    <script src="config.js"></script>
    <script>
        const form = document.getElementById('registrationForm');
        const modal = document.getElementById('successModal');
        const donationSelect = document.getElementById('donation');

        donationSelect.addEventListener('change', function() {
            if (this.value !== '') this.classList.remove('placeholder');
        });

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            if (!window.APP_CONFIG || !window.APP_CONFIG.TELEGRAM_BOT_TOKEN) {
                alert('Не настроен config.js — обратитесь к администратору сайта.');
                return;
            }

            const fio      = document.getElementById('fio').value.trim();
            const social   = document.getElementById('social').value.trim();
            const city     = document.getElementById('city').value.trim();
            const church   = document.getElementById('church').value.trim();
            const donation = donationSelect.value;

            const text =
                '📋 Новая анкета с сайта "Живой источник"\n\n' +
                '👤 Ф.И.О.: ' + fio + '\n' +
                '📱 Соцсеть: ' + social + '\n' +
                '📍 Город: ' + city + '\n' +
                '⛪ Церковь: ' + church + '\n' +
                '💰 Пожертвование 500 ₽: ' + donation + '\n\n' +
                '🕐 ' + new Date().toLocaleString('ru-RU');

            const url = 'https://api.telegram.org/bot' +
                        window.APP_CONFIG.TELEGRAM_BOT_TOKEN + '/sendMessage';

            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: window.APP_CONFIG.TELEGRAM_CHAT_ID,
                    text: text
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.ok) {
                    modal.classList.add('active');
                    form.reset();
                    donationSelect.classList.add('placeholder');
                } else {
                    alert('Ошибка Telegram: ' + (data.description || 'неизвестная ошибка'));
                }
            })
            .catch(error => {
                alert('Ошибка отправки. Проверьте интернет.');
                console.error(error);
            });
        });

        function closeModal() { modal.classList.remove('active'); }
        modal.addEventListener('click', function(e) {
            if (e.target === modal) closeModal();
        });
    </script>
</body>
</html>
